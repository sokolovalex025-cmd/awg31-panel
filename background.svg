<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020814"/><stop offset=".45" stop-color="#071b31"/><stop offset="1" stop-color="#01050b"/></linearGradient>
 <radialGradient id="glow1" cx="50%" cy="45%" r="65%"><stop stop-color="#174b78" stop-opacity=".55"/><stop offset="1" stop-color="#020814" stop-opacity="0"/></radialGradient>
 <radialGradient id="glow2" cx="50%" cy="50%" r="60%"><stop stop-color="#008b91" stop-opacity=".20"/><stop offset="1" stop-color="#020814" stop-opacity="0"/></radialGradient>
 <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173d60"/><stop offset="1" stop-color="#061322"/></linearGradient>
 <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0d2943"/><stop offset="1" stop-color="#030b14"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#061b2d"/><stop offset="1" stop-color="#01070e"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#sky)"/>
<rect width="1920" height="760" fill="url(#glow1)"/>
<ellipse cx="1550" cy="700" rx="520" ry="300" fill="url(#glow2)" filter="url(#blur)"/>
<!-- subtle stars / atmosphere -->
<g fill="#9cc9e8" opacity=".32">
 <circle cx="260" cy="130" r="2"/><circle cx="510" cy="210" r="1.5"/><circle cx="820" cy="105" r="1.5"/><circle cx="1180" cy="165" r="2"/><circle cx="1510" cy="95" r="1.5"/><circle cx="1740" cy="250" r="2"/>
</g>
<!-- distant mountains -->
<path d="M0 700 L250 500 L430 640 L700 360 L940 650 L1180 430 L1430 650 L1650 390 L1920 670 V820 H0Z" fill="#071827" opacity=".8"/>
<!-- main mountain range -->
<path d="M0 760 L210 610 L390 700 L650 430 L830 610 L1080 280 L1280 540 L1510 350 L1740 600 L1920 470 V850 H0Z" fill="url(#mountain)"/>
<path d="M1080 280 L1015 410 L1060 385 L1080 425 L1125 360 L1160 430 L1215 505 L1280 540Z" fill="#8fb4cf" opacity=".22"/>
<path d="M650 430 L590 540 L625 520 L655 555 L690 505 L725 555 L830 610Z" fill="#9abbd0" opacity=".16"/>
<path d="M1510 350 L1450 470 L1490 445 L1525 490 L1570 440 L1620 515 L1740 600Z" fill="#9abbd0" opacity=".13"/>
<!-- foreground -->
<path d="M0 800 Q300 690 610 790 T1220 760 T1920 720 V1080 H0Z" fill="url(#mountain2)"/>
<!-- lake -->
<path d="M0 830 Q420 790 900 830 T1920 800 V1080 H0Z" fill="url(#water)"/>
<g opacity=".18" stroke="#5aa5c7" stroke-width="3">
 <path d="M180 900 Q500 875 820 900 T1500 900"/><path d="M360 950 Q700 925 1040 950 T1750 945"/><path d="M120 1010 Q500 985 900 1010 T1800 1000"/>
</g>
<!-- restrained city lights -->
<g fill="#f3c77a" opacity=".65" filter="url(#soft)">
 <circle cx="430" cy="850" r="4"/><circle cx="520" cy="865" r="3"/><circle cx="1370" cy="820" r="4"/><circle cx="1490" cy="835" r="3"/><circle cx="1600" cy="810" r="3"/>
</g>
</svg>
