name: Publish NOVA AntiZapret Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "NOVA_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/nova-release.jks

      - name: Build signed APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/nova-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NOVA-AntiZapret.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AntiZapret-release
          path: NOVA-AntiZapret.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: NOVA-AntiZapret.apk
          generate_release_notes: true
          make_latest: true
