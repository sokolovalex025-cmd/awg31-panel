name: Python checks
on:
  push:
    branches: [ main ]
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/python-check.yml'
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/python-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip Flask 'qrcode[pil]'
      - name: Compile Python modules
        run: python -m py_compile app.py app9.py advanced_panel.py naiveproxy_panel.py telegram_bot.py system_panel.py mobile_nav.py security_hardening.py
      - name: Import modules
        run: python -c "import app; import security_hardening; import mobile_nav; import app9; print('AWG Panel Python modules OK')"
