name: Python checks
on:
  push:
    branches: [ main ]
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/python-check.yml'
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/python-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip Flask 'qrcode[pil]' pytest
      - name: Compile Python modules
        run: python -m py_compile app.py app9.py nova11.py panel_bootstrap.py nova12_theme.py nova13_theme.py nova14_theme.py nova15_theme.py nova16_server_card_fix.py nova_scroll_buttons.py nova_awg31_fix.py antiblock.py nova_shield.py nova_resilience.py nova_doctor_ui.py domain_manager.py naiveproxy_panel.py telegram_bot.py telegram_runner.py telegram_ui.py telegram_delete.py telegram_payments.py system_panel.py mobile_nav.py security_hardening.py keenetic.py balancer.py balancer_provision.py nova_mobile_diagnostics.py nova12_diagnostics.py nova_mobile_diagnostics3.py nova12_clients.py nova12_ui.py nova_command_center.py nova_toolza_external.py
      - name: Import modules
        run: python -c "import app; import app9; import nova11; import nova12_diagnostics; import nova_mobile_diagnostics3; import nova12_clients; import nova12_ui; import nova_command_center; import nova_doctor_ui; import nova_awg31_fix; import nova_resilience; import balancer; import balancer_provision; nova12_diagnostics.apply(nova11); nova_mobile_diagnostics3.apply(nova11); nova12_clients.apply(app); nova12_ui.apply(nova11); nova_resilience.apply(nova11.core.app); nova_doctor_ui.apply(nova11); nova_command_center.apply(nova11); print('NOVA Python modules, Doctor, Command Center, Mobile Diagnostics 3.0, Client Profiles and UI OK')"
      - name: Shell syntax
        run: bash -n install-nova11.sh install-nova-max.sh update-panel.sh install-balancer.sh nova-network-fix.sh nova-migrate.sh nova-verify.sh nova-max-backup.sh nova-watchdog.sh provision-balancer-node.sh install-awg-toolza.sh
      - name: Run tests
        run: pytest -q
