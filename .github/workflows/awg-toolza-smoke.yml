name: AWG Toolza integration smoke
on:
  push:
    branches: [ main ]
    paths:
      - 'nova_toolza_external.py'
      - 'nova_toolza_center.py'
      - 'install-awg-toolza.sh'
      - 'tests/test_nova_toolza_external.py'
  pull_request:
    paths:
      - 'nova_toolza_external.py'
      - 'nova_toolza_center.py'
      - 'install-awg-toolza.sh'
      - 'tests/test_nova_toolza_external.py'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask
      - run: python -m py_compile nova_toolza_external.py nova_toolza_center.py panel_bootstrap.py
      - run: bash -n install-awg-toolza.sh update-panel.sh
      - run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          root=Path(".")
          ast.parse((root/"nova_toolza_external.py").read_text())
          ext=(root/"nova_toolza_external.py").read_text()
          ins=(root/"install-awg-toolza.sh").read_text()
          assert "ecccafa3094181a6962ff71e54527e4771657698" in ext
          assert 'subprocess.run' in ext and '["--help"]' in ext
          assert 'bash -n "$tmp"' in ins
          assert "NOVA awg0.conf was not modified." in ins
          print("AWG Toolza integration smoke: PASS")
          PY
