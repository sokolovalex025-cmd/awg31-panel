name: Normalize app.py to 8.1
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - '.github/workflows/normalize-app-81.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update app.py
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          for a,b in [
              ('AWG Panel 7.1','AWG Panel 8.1'),
              ('AWG Panel 7.2','AWG Panel 8.1'),
              ('AWG Panel 7.3','AWG Panel 8.1'),
              ('AWG Panel 7.4','AWG Panel 8.1'),
              ('AWG Panel 8.0','AWG Panel 8.1'),
              ('v=71','v=82'),('v=72','v=82'),('v=73','v=82'),
              ('v=74','v=82'),('v=80','v=82'),('v=81','v=82')
          ]:
              s=s.replace(a,b)
          if 'sys.modules.setdefault("app", sys.modules[__name__])' not in s:
              s=s.replace('from flask import', 'import sys\nsys.modules.setdefault("app", sys.modules[__name__])\n\nfrom flask import', 1)
          additions=[]
          for mod in ('naiveproxy_panel','telegram_bot','system_panel','advanced_panel'):
              if f'{mod}.register(app)' not in s:
                  additions.append(f'import {mod}\n{mod}.register(app)\n')
          if additions:
              marker='if __name__==\'__main__\':'
              if marker in s:
                  s=s.replace(marker,''.join(additions)+marker,1)
              else:
                  marker='if __name__=="__main__":'
                  if marker in s:s=s.replace(marker,''.join(additions)+marker,1)
          p.write_text(s)
          PY
          python3 -m py_compile app.py
      - name: Commit normalized app.py
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Normalize app.py to AWG Panel 8.1'
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/normalize-app-81.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove one-time app normalization workflow'
          git push
