name: Bandju Telegram Bot Check

on:
  push:
    paths:
      - "bandju-telegram-bot/**"
      - ".github/workflows/bandju-telegram-bot-check.yml"
  pull_request:
    paths:
      - "bandju-telegram-bot/**"
      - ".github/workflows/bandju-telegram-bot-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bandju-telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile bot.py bandju_api.py
      - name: Validate shell
        run: |
          bash -n install.sh
          bash -n bandju-telegram-bot-api-check
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
